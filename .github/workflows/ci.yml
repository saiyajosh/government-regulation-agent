name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # postinstall runs `wrangler types`, which only reads wrangler.jsonc.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:types
      - run: pnpm lint
      - run: pnpm test
